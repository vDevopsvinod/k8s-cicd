name: Full K8s CI/CD (Terraform + kubeadm)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # 🔹 AWS Login
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 🔹 Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # 🔥 FULL CLEAN (VERY IMPORTANT)
    - name: Clean Terraform Completely
      run: |
        rm -rf .terraform
        rm -f terraform.tfstate
        rm -f terraform.tfstate.backup
        rm -f terraform.lock.hcl
      working-directory: terraform

    # 🔹 Terraform Init (fresh)
    - name: Terraform Init
      run: terraform init -upgrade
      working-directory: terraform

    # 🔹 Terraform Apply (no cache)
    - name: Terraform Apply
      run: terraform apply -auto-approve -no-color
      working-directory: terraform

    # 🔹 Get Outputs
    - name: Get Outputs
      run: |
        echo "MASTER_IP=$(terraform output -raw master_ip)" >> $GITHUB_ENV
        echo "WORKER_IPS=$(terraform output -json worker_ips | jq -r '.[]')" >> $GITHUB_ENV
      working-directory: terraform

    # 🔹 Create PEM Key
    - name: Create Key
      run: |
        echo "${{ secrets.EC2_KEY_PAIR }}" > key.pem
        chmod 400 key.pem

    # 🔹 Wait for EC2 (important)
    - name: Wait for EC2
      run: sleep 90

    # 🔹 Setup Master
    - name: Setup Master Node
      run: |
        scp -i key.pem -o StrictHostKeyChecking=no scripts/master.sh ubuntu@$MASTER_IP:/home/ubuntu/
        ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@$MASTER_IP "chmod +x master.sh && ./master.sh"

    # 🔹 Fetch Join Script
    - name: Fetch Join Script
      run: |
        scp -i key.pem -o StrictHostKeyChecking=no ubuntu@$MASTER_IP:/home/ubuntu/join.sh ./join.sh

    # 🔹 Setup Workers
    - name: Setup Worker Nodes
      run: |
        for ip in $WORKER_IPS; do
          scp -i key.pem -o StrictHostKeyChecking=no scripts/worker.sh ubuntu@$ip:/home/ubuntu/
          scp -i key.pem -o StrictHostKeyChecking=no join.sh ubuntu@$ip:/home/ubuntu/
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@$ip "chmod +x worker.sh && ./worker.sh"
        done