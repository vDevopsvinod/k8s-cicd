name: K8s CI/CD (1 Master + 1 Worker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 🔹 Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # 🔹 AWS Login
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 🔹 Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # 🔹 Clean old state (IMPORTANT)
    - name: Clean Terraform
      run: |
        rm -rf .terraform
        rm -f terraform.tfstate
        rm -f terraform.tfstate.backup
        rm -f terraform.lock.hcl
      working-directory: terraform

    # 🔹 Init
    - name: Terraform Init
      run: terraform init -upgrade
      working-directory: terraform

    # 🔹 Apply
    - name: Terraform Apply
      run: terraform apply -auto-approve -no-color
      working-directory: terraform

    # 🔹 Get Outputs
    - name: Get IPs
      run: |
        echo "MASTER_IP=$(terraform output -raw master_ip)" >> $GITHUB_ENV
        echo "WORKER_IP=$(terraform output -raw worker_ip)" >> $GITHUB_ENV
      working-directory: terraform

    # 🔹 Create PEM file
    - name: Create Key
      run: |
        echo "${{ secrets.EC2_KEY_PAIR }}" > key.pem
        chmod 400 key.pem

    # 🔹 Wait for EC2 boot
    - name: Wait for Instances
      run: sleep 90

    # 🔹 Setup Master Node
    - name: Setup Master
      run: |
        scp -i key.pem -o StrictHostKeyChecking=no scripts/master.sh ubuntu@$MASTER_IP:/home/ubuntu/
        ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@$MASTER_IP "chmod +x master.sh && ./master.sh"

    # 🔹 Fetch Join Script
    - name: Fetch Join Command
      run: |
        scp -i key.pem -o StrictHostKeyChecking=no ubuntu@$MASTER_IP:/home/ubuntu/join.sh ./join.sh

    # 🔹 Setup Worker Node
    - name: Setup Worker
      run: |
        scp -i key.pem -o StrictHostKeyChecking=no scripts/worker.sh ubuntu@$WORKER_IP:/home/ubuntu/
        scp -i key.pem -o StrictHostKeyChecking=no join.sh ubuntu@$WORKER_IP:/home/ubuntu/
        ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@$WORKER_IP "chmod +x worker.sh && ./worker.sh"