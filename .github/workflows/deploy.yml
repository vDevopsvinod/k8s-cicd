name: K8s CI/CD (1 Master + 1 Worker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
    # 🔹 Checkout
    - name: Checkout
      uses: actions/checkout@v3

    # 🔹 Debug Terraform file
    - name: Debug main.tf
      run: cat main.tf

    # 🔹 AWS Credentials
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 🔹 Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ✅ Init (S3 backend should be configured)
    - name: Terraform Init
      run: terraform init -upgrade

    # ✅ Validate (important)
    - name: Terraform Validate
      run: terraform validate

    # 🔹 Plan
    - name: Terraform Plan
      run: terraform plan -out=tfplan -no-color

    # 🔹 Apply
    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan

    # 🔹 Get Outputs
    - name: Get IPs
      run: |
        echo "MASTER_IP=$(terraform output -raw master_ip)" >> $GITHUB_ENV
        echo "WORKER_IP=$(terraform output -raw worker_ip)" >> $GITHUB_ENV

    # 🔹 Create PEM
    - name: Create Key
      run: |
        echo "${{ secrets.EC2_KEY_PAIR }}" > key.pem
        chmod 400 key.pem

    # ✅ Wait for SSH (better than sleep)
    - name: Wait for Master SSH
      run: |
        for i in {1..20}; do
          ssh -i key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@$MASTER_IP "echo OK" && break
          echo "Waiting for Master..."
          sleep 10
        done

    # 🔹 Setup Master
    - name: Setup Master
      run: |
        scp -i key.pem -o StrictHostKeyChecking=no ../scripts/master.sh ubuntu@$MASTER_IP:/home/ubuntu/
        ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@$MASTER_IP "chmod +x master.sh && ./master.sh"

    # 🔹 Fetch Join Script
    - name: Fetch Join Script
      run: |
        scp -i key.pem -o StrictHostKeyChecking=no ubuntu@$MASTER_IP:/home/ubuntu/join.sh ./join.sh

    - name: Debug master script
      run: |
       echo "===== MASTER SCRIPT CONTENT ====="
       cat scripts/master.sh

    # ✅ Wait for Worker SSH
    - name: Wait for Worker SSH
      run: |
        for i in {1..20}; do
          ssh -i key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@$WORKER_IP "echo OK" && break
          echo "Waiting for Worker..."
          sleep 10
        done

    # 🔹 Setup Worker
    - name: Setup Worker
      run: |
        scp -i key.pem -o StrictHostKeyChecking=no ../scripts/worker.sh ubuntu@$WORKER_IP:/home/ubuntu/
        scp -i key.pem -o StrictHostKeyChecking=no ./join.sh ubuntu@$WORKER_IP:/home/ubuntu/
        ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@$WORKER_IP "chmod +x worker.sh && ./worker.sh"